<!-- Modal -->
<div id="crudModal" class="hidden fixed inset-0 z-50 w-full flex items-center justify-center bg-black bg-opacity-50">
  <div id="crudModalContent" class="bg-white rounded-lg shadow-lg w-5/6 sm:w-3/5 md:w-1/2 lg:w-2/5 xl:w-1/3 max-h-screen overflow-y-auto border-2 border-[#FDB913]">
    <!-- Modal header -->
    <div class="flex items-center justify-between p-4 border-b border-gray-200">
      <div>
        <h3 id="modalTitle" class="text-xl font-bold text-[#A50044]">
          Add New Product
        </h3>
        <p class="text-sm text-gray-600 mt-1">Show your support for Barça with new merchandise!</p>
      </div>
      <button type="button"
              class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center"
              onclick="hideModal()">
        <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd"></path>
        </svg>
        <span class="sr-only">Close modal</span>
      </button>
    </div>
    <!-- Modal body -->
    <div class="px-6 py-4 space-y-6 form-style">
      <form id="productForm" onsubmit="event.preventDefault(); saveProductEntry();">
        <div class="mb-4">
          <label for="name" class="block text-sm font-medium text-gray-700">Product Name</label>
          <input type="text" id="name" name="name"
                 class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"
                 placeholder="Enter product name" required>
        </div>

        <div class="mb-4">
          <label for="price" class="block text-sm font-medium text-gray-700">Price (Rp)</label>
          <input type="number" id="price" name="price"
                 class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"
                 placeholder="e.g. 250000" required>
        </div>

        <div class="mb-4">
          <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
          <select id="category" name="category"
                  class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" required>
            <option value="">Choose category</option>
            <option value="sepatu">Sepatu</option>
            <option value="pakaian">Pakaian</option>
            <option value="bola">Bola</option>
            <option value="aksesoris">Aksesoris</option>
          </select>
        </div>

        <div class="mb-4">
          <label for="stock" class="block text-sm font-medium text-gray-700">Stock</label>
          <input type="number" id="stock" name="stock"
                 class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"
                 placeholder="Enter stock quantity" required>
        </div>

        <div class="mb-4">
          <label for="image_url" class="block text-sm font-medium text-gray-700">Image URL</label>
          <input type="url" id="image_url" name="image_url"
                 class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"
                 placeholder="https://example.com/product.jpg">
        </div>

        <div class="mb-4">
          <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
          <textarea id="description" name="description" rows="3"
                    class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"
                    placeholder="Describe the product..." required></textarea>
        </div>

        <div class="mb-4 flex items-center">
          <input id="is_featured" name="is_featured" type="checkbox"
                 class="w-4 h-4 text-[#A50044] bg-gray-100 border-gray-300 rounded">
          <label for="is_featured" class="ml-2 text-sm font-medium text-gray-900">Featured Product</label>
        </div>
      </form>
    </div>
    <!-- Modal footer -->
    <div class="flex flex-col sm:flex-row gap-4 p-6 border-t border-gray-200 rounded-b">
      <button type="button"
              id="cancelButton"
              class="order-2 sm:order-1 px-6 py-3 border border-gray-300 text-gray-700 rounded-md font-medium hover:bg-gray-50 transition-colors text-center"
              onclick="hideModal()">
        Cancel
      </button>
      <button type="submit"
              id="submitProduct"
              form="productForm"
              class="order-1 sm:order-2 flex-1 bg-[#A50044] text-white px-6 py-3 rounded-md font-medium hover:bg-[#004D98] transition-colors">
        Save Product
      </button>
    </div>
  </div>
    <script>
    function showModal() {
        const modal = document.getElementById('crudModal');
        const modalContent = document.getElementById('crudModalContent');

        modal.classList.remove('hidden'); 
        setTimeout(() => {
        modalContent.classList.remove('opacity-0', 'scale-95');
        modalContent.classList.add('opacity-100', 'scale-100');
        }, 50); 
    }

    function hideModal() {
        const modal = document.getElementById('crudModal');
        const modalContent = document.getElementById('crudModalContent');

        modalContent.classList.remove('opacity-100', 'scale-100');
        modalContent.classList.add('opacity-0', 'scale-95');

        setTimeout(() => {
        modal.classList.add('hidden');
        }, 150); 
    }

    async function addProductEntry() {
        const form = document.querySelector('#productForm');
        const formData = new FormData(form);

        await fetch("{% url 'main:add_product_entry_ajax' %}", {
            method: "POST",
            body: formData
        });

        form.reset();
        hideModal();

        showToast('✅ Product added successfully!', '', 'success');
        document.dispatchEvent(new CustomEvent('productAdded'));
        return false;
        }

        document.getElementById("productForm").addEventListener("submit", function(e) {
        e.preventDefault();
        addProductEntry();
        });
        
    </script>
    
</div>
<div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white rounded-lg p-6 shadow-lg text-center max-w-sm w-full border-2 border-[#FDB913]">
    <h2 class="text-lg font-bold text-gray-800 mb-2">Delete Product?</h2>
    <p class="text-sm text-gray-600 mb-6">This action cannot be undone.</p>
    <div class="flex justify-center gap-4">
      <button onclick="hideDeleteModal()" class="px-4 py-2 rounded-md bg-gray-200 hover:bg-gray-300">Cancel</button>
      <button id="confirmDeleteBtn" class="px-4 py-2 rounded-md bg-red-600 text-white hover:bg-red-700" onclick="confirmDeleteProduct()">Delete</button>
    </div>
  </div>
</div>

<script>
  // JS modal delete
  let deleteProductId = null;

  function showDeleteModal(productId) {
    deleteProductId = productId;
    document.getElementById('deleteModal').classList.remove('hidden');
  }

  function hideDeleteModal() {
    document.getElementById('deleteModal').classList.add('hidden');
  }

  async function confirmDeleteProduct() {
    if (!deleteProductId) return;
    try {
      await fetch(`/delete-product-ajax/${deleteProductId}/`, { method: 'DELETE' });
      hideDeleteModal();
      showToast('🗑️ Product deleted successfully!', '', 'success');
      document.dispatchEvent(new CustomEvent('productDeleted'));
    } catch (err) {
      showToast('❌ Failed to delete product.', '', 'error');
    }
  }
</script>
<script>
let editProductId = null;

// open modal in edit mode
function openEditModal(product) {
  editProductId = product.id;
  document.getElementById("modalTitle").textContent = "Edit Product";
  
  document.getElementById("name").value = product.name;
  document.getElementById("price").value = product.price;
  document.getElementById("category").value = product.category;
  document.getElementById("stock").value = product.stock;
  document.getElementById("image_url").value = product.image_url;
  document.getElementById("description").value = product.description;
  document.getElementById("is_featured").checked = product.is_featured;

  showModal();
}

// override addProductEntry if edit mode
async function saveProductEntry() {
  const form = document.querySelector('#productForm');
  const formData = new FormData(form);
  const url = editProductId
    ? `/update-product-ajax/${editProductId}/`
    : "{% url 'main:add_product_entry_ajax' %}`;

  await fetch(url, { method: "POST", body: formData });
  form.reset();
  hideModal();

  const msg = editProductId ? "Product updated successfully!" : "Product added successfully!";
  showToast(`✅ ${msg}`, '', 'success');
  document.dispatchEvent(new CustomEvent('productUpdated'));

  editProductId = null;
  document.getElementById("modalTitle").textContent = "Add New Product";
}
</script>
